events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # File upload limits for large modules
    client_max_body_size 512M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Buffer settings for large uploads
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    send_timeout 300s;

    # Upstream Gitea
    upstream gitea_backend {
        server gitea:3000;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=gitea_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name git.gloom-dev.local;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name git.gloom-dev.local;

        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/nginx/certs/live/git.gloom-dev.local/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/git.gloom-dev.local/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # HSTS preload
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Root for ACME challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # API rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://gitea_backend;
            include /etc/nginx/proxy_params;
        }

        # Git operations (push/pull/clone) - higher limits
        location ~ ^/(.*/)?git/(.*)$ {
            limit_req zone=gitea_limit burst=50 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://gitea_backend;
            include /etc/nginx/proxy_params;

            # Increase timeouts for git operations
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
        }

        # LFS uploads - special handling
        location ~ ^/(.*/)?info/lfs/objects/ {
            limit_req zone=gitea_limit burst=10 nodelay;
            limit_conn conn_limit 5;

            proxy_pass http://gitea_backend;
            include /etc/nginx/proxy_params;

            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            client_max_body_size 512M;
        }

        # Attachments and releases - large files
        location ~ ^/(.*/)?(raw|archive|release)/ {
            limit_req zone=gitea_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://gitea_backend;
            include /etc/nginx/proxy_params;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Main Gitea application
        location / {
            limit_req zone=gitea_limit burst=20 nodelay;
            limit_conn conn_limit 30;

            proxy_pass http://gitea_backend;
            include /etc/nginx/proxy_params;
        }
    }
}