version: '3.8'

services:
  gitea:
    image: gitea/gitea:1.22-rootless
    container_name: gloom-gitea
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea.db
      - GITEA__server__DOMAIN=git.gloom-dev.local
      - GITEA__server__SSH_DOMAIN=git.gloom-dev.local
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__ROOT_URL=https://git.gloom-dev.local/
      - GITEA__server__DISABLE_SSH=false
      - GITEA__server__SSH_LISTEN_PORT=2222
      - GITEA__server__LFS_START_SERVER=true
      - GITEA__repository__UPLOAD_TEMP_PATH=/data/tmp
      - GITEA__log__MODE=console
      - GITEA__log__LEVEL=info
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=change-me-in-production
      - GITEA__database__SQLITE_TIMEOUT=300
      - GITEA__repository__MAX_UPLOAD_FILE_SIZE=512M
      - GITEA__session__PROVIDER=file
    volumes:
      - ./data:/data
      - ./config:/config
      - ./logs:/log
      - ./tmp:/data/tmp
    networks:
      - gloom-git-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: gloom-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - gitea
    networks:
      - gloom-git-network

networks:
  gloom-git-network:
    driver: bridge
    name: gloom-git-network

volumes:
  gitea-data:
    driver: local